name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff beautifulsoup4 requests
      - run: ruff format --check .
      - run: ruff check .
      - name: run every folder
        run: |
          for d in 20*/; do
            echo "== $d"
            (cd "$d" && python main.py)
          done
